<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留言管理 · 杨存邦</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#C5A059', light: '#E8D5A3', dark: '#A07D3A' },
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'Menlo', 'monospace'],
          },
        },
      },
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #07070d;
      color: #f0eee6;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 20% 20%, rgba(197, 160, 89, 0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.06); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.12); }

    .card {
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: #141414;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(92, 90, 82, 0.7);
      text-align: left;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      font-weight: 500;
    }

    td {
      padding: 0.75rem 1rem;
      font-size: 14px;
      color: rgba(240, 238, 230, 0.7);
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="relative z-10 mx-auto max-w-5xl px-6 py-16 sm:px-10">
    <!-- Header -->
    <div class="mb-10 flex items-center justify-between">
      <div>
        <div class="mb-2 flex items-center gap-3">
          <span class="font-mono text-xs text-gold/60">//</span>
          <span class="font-mono text-[11px] tracking-widest uppercase text-white/30">Admin</span>
          <div class="h-px w-20 bg-white/[0.04]" />
        </div>
        <h1 class="text-3xl font-black tracking-tight text-white/90">
          留言<span class="text-gradient">管理</span>
        </h1>
        <p class="mt-1 text-sm text-white/40">来自主页的访客留言</p>
      </div>
      <button
        onclick="location.reload()"
        class="rounded-xl border border-white/[0.06] bg-white/[0.03] px-4 py-2.5 font-mono text-xs tracking-wider text-white/40 transition-all duration-300 hover:border-gold/20 hover:text-gold/70"
      >
        刷新
      </button>
    </div>

    <!-- Table card -->
    <div class="card overflow-hidden">
      <div class="overflow-x-auto">
        <table>
          <thead>
            <tr>
              <th class="w-[140px]">姓名</th>
              <th>留言内容</th>
              <th class="w-[180px]">时间</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr>
              <td colspan="3" class="py-16 text-center font-mono text-sm text-white/20">
                <!-- Loading state -->
                <span id="loading-text">加载中...</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center">
      <p class="font-mono text-[10px] tracking-widest text-white/15">
        Powered by Supabase · 杨存邦
      </p>
    </div>
  </div>

  <script>
    const supabase = supabase.createClient(
      'https://weyhuopnfwdryokojkva.supabase.co',
      'sb_publishable_lm3y_VvHpRKVSFPLNojKPA_OSJuhgOO'
    );

    async function loadMessages() {
      const tbody = document.getElementById('table-body');
      const loading = document.getElementById('loading-text');

      const { data, error } = await supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        loading.textContent = '加载失败：' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        loading.textContent = '暂无留言';
        return;
      }

      tbody.innerHTML = data.map(msg => {
        const date = msg.created_at
          ? new Date(msg.created_at).toLocaleString('zh-CN', {
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
            })
          : '--';
        return `
          <tr>
            <td class="font-medium text-white/80">${escapeHtml(msg.name)}</td>
            <td class="max-w-md leading-relaxed whitespace-pre-wrap">${escapeHtml(msg.content)}</td>
            <td class="font-mono text-xs text-white/30">${date}</td>
          </tr>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    loadMessages();
  </script>

</body>
</html>
